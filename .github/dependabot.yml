version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Seoul
    open-pull-requests-limit: 10
    groups:
      nestjs:
        patterns:
          - '@nestjs/*'
        update-types:
          - minor
          - patch
      prisma:
        patterns:
          - prisma
          - '@prisma/*'
        update-types:
          - minor
          - patch
      lint-test:
        dependency-type: development
        patterns:
          - '@eslint/*'
          - '@swc/*'
          - '@types/*'
          - '@vitest/*'
          - eslint
          - prettier
          - supertest
          - tsup
          - typescript
          - typescript-eslint
          - vitest
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Seoul
    groups:
      actions:
        patterns:
          - '*'
