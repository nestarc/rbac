name: Verification

on:
  workflow_call:
    inputs:
      checkout-ref:
        description: Exact commit or tag to verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency audit policy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.checkout-ref }}

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify production and full dependency audits
        run: npm run verify:dependency-audit

  verify:
    name: Verify (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22
          - 24

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.checkout-ref }}

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify exact modern toolchain
        run: npm ls --depth=0 @nestjs/common @nestjs/core @prisma/client prisma @prisma/adapter-pg

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: E2E
        run: npm run test:e2e

      - name: Build
        run: npm run build

      - name: Coverage
        run: npm run test:coverage

      - name: Upload Node 24 build
        if: matrix.node-version == 24
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rbac-dist
          path: dist
          if-no-files-found: error
          retention-days: 1

  package:
    name: Package contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: verify

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.checkout-ref }}

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Download verified Node 24 build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rbac-dist
          path: dist

      - name: Create and verify package once
        run: node scripts/prepare-package.cjs --output artifacts/package

      - name: Upload package candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rbac-package
          path: artifacts/package
          if-no-files-found: error
          retention-days: 1

  modern-consumer:
    name: Strict consumer (Node ${{ matrix.node-version }} / Nest 11.2.1 / Prisma 7.10.0)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: package
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22
          - 24

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.checkout-ref }}

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Download package candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rbac-package
          path: artifacts/package

      - name: Verify packed consumer, shipped examples, and API key source conflict
        run: npm run test:consumer:modern:artifact

  nest10-consumer:
    name: Strict consumer (Node 24 / Nest 10.4.22)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: package

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.checkout-ref }}

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Download package candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rbac-package
          path: artifacts/package

      - name: Verify Nest 10.4.22 packed consumer
        run: npm run test:consumer:nest10:artifact

  nest12-consumer:
    name: Strict consumer (Node ${{ matrix.node-version }} / Nest 12.0.1)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: package
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22
          - 24

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.checkout-ref }}

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Download package candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rbac-package
          path: artifacts/package

      - name: Verify Nest 12.0.1 packed consumer
        run: npm run test:consumer:nest12:artifact

  prisma-integration:
    name: Prisma ${{ matrix.prisma-version }} Integration (PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - prisma-version: 5.22.0
            client: legacy
          - prisma-version: 6.19.3
            client: legacy
          - prisma-version: 7.10.0
            client: modern
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rbac
          POSTGRES_PASSWORD: rbac
          POSTGRES_DB: rbac_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://rbac:rbac@127.0.0.1:5432/rbac_test
      RBAC_PRISMA_DATABASE_URL: postgresql://rbac:rbac@127.0.0.1:5432/rbac_test

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.checkout-ref }}

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Align temporary legacy Prisma manifest
        if: matrix.client == 'legacy'
        run: >-
          npm pkg set
          "devDependencies.@prisma/client=${{ matrix.prisma-version }}"
          "devDependencies.prisma=${{ matrix.prisma-version }}"

      - name: Install exact legacy Prisma runtime
        if: matrix.client == 'legacy'
        run: >-
          npm install --no-save --ignore-scripts --strict-peer-deps --no-audit --no-fund
          @prisma/client@${{ matrix.prisma-version }} prisma@${{ matrix.prisma-version }}

      - name: Verify exact modern NestJS and Prisma versions
        if: matrix.client == 'modern'
        run: npm ls --depth=0 @nestjs/common @nestjs/core @prisma/client prisma @prisma/adapter-pg

      - name: Verify exact legacy NestJS and Prisma versions
        if: matrix.client == 'legacy'
        run: npm ls --depth=0 @nestjs/common @nestjs/core @prisma/client prisma

      - name: Generate modern Prisma client
        if: matrix.client == 'modern'
        run: npm run prisma:generate

      - name: Generate legacy Prisma client
        if: matrix.client == 'legacy'
        run: npm run prisma:generate:legacy

      - name: Apply RBAC migration with modern Prisma
        if: matrix.client == 'modern'
        run: npm run prisma:migrate:test

      - name: Apply RBAC migration with legacy Prisma
        if: matrix.client == 'legacy'
        run: npm run prisma:migrate:test:legacy

      - name: Run Prisma contract tests
        run: npm run test:prisma
        env:
          RBAC_PRISMA_CLIENT: ${{ matrix.client }}
