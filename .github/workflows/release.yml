name: Release

on:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  release-target:
    name: Verify release target
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout release tag and history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Verify tag, package version, checkout, target, and main ancestry
        run: npm run verify:release-target
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_TARGET_COMMITISH: ${{ github.event.release.target_commitish }}

  verification:
    name: Verification
    needs: release-target
    uses: ./.github/workflows/verification.yml
    with:
      checkout-ref: ${{ github.event.release.tag_name }}

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    needs:
      - release-target
      - verification

    steps:
      - name: Checkout release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Download verified package candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rbac-package
          path: artifacts/package

      - name: Verify exact package candidate
        id: package
        run: npm run package:verify

      - name: Publish verified tarball with provenance
        run: npm publish "${{ steps.package.outputs.tarball }}" --access public --provenance

      - name: Verify published integrity and provenance
        run: npm run verify:published-package
