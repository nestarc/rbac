name: Release

on:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  release-target:
    name: Verify release target
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout release tag and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Verify tag, package version, checkout, target, and main ancestry
        run: npm run verify:release-target
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_TARGET_COMMITISH: ${{ github.event.release.target_commitish }}

  verification:
    name: Verification
    needs: release-target
    uses: ./.github/workflows/verification.yml
    with:
      checkout-ref: ${{ github.event.release.tag_name }}

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    needs:
      - release-target
      - verification

    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Download verified package candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rbac-package
          path: artifacts/package

      - name: Verify exact package candidate
        id: package
        run: npm run package:verify

      - name: Publish verified tarball with provenance
        run: npm publish "${{ steps.package.outputs.tarball }}" --access public --provenance

      - name: Verify published integrity and provenance
        run: npm run verify:published-package
